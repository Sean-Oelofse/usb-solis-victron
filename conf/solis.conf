# ---------------------------------------------------------------------------
# solis.conf  -  configuration for the Solis USB discovery supervisor
# Edit, then restart the service:   svc -t /service/dbus-solis
# ---------------------------------------------------------------------------

# Modbus serial settings
baud = 9600
# Slave (unit) ids to try on each port. Comma-separated. Solis default is 1.
# If you daisy-chain several inverters on ONE RS485 bus, list them: 1,2,3
slaves = 1

# Electrical model
phases   = 1          # 1 = single-phase, 3 = three-phase
# Rated AC power in W. 'auto' reads the factory nameplate from the inverter
# (register 3109) on discovery - leave it as auto unless that reads wrong.
rated          = auto
rated_fallback = 5000 # used only if auto-detect fails
position = 1          # 0 = AC input, 1 = AC output, 2 = AC input 2

# --- Power limiting (WRITES to the inverter) -------------------------------
# Off by default: the driver is strictly read-only and will not touch any
# holding register. Set to 1 ONLY after you have verified the control register
# map (CTRL in dbus-solis.py) against the Ginlong doc for YOUR model.
enable_control = 0
initial_limit  = -1   # W to apply at startup (<0 = unlimited). Control only.
max_percent    = 100  # ceiling as % of rated
reassert       = 0    # 1 = re-send limit every poll (only if your model drops it)

# --- Discovery -------------------------------------------------------------
scan_interval = 20    # seconds between USB rescans

# Leave 'ports' empty to AUTO-DISCOVER all USB serial ports. To pin specific
# ports instead (and disable probing/auto-scan), list them:
#   ports = /dev/ttyUSB0,/dev/ttyUSB1
ports =

# Skip ports already running a Victron serial-starter driver (VE.Direct, GPS,
# energy meters, etc.). Keep this 1 unless you know the port is Solis-only.
respect_serial_starter = 1

# --- Device identity (what keeps the same VRM device across reboots) --------
# By default each inverter's DeviceInstance is keyed on its physical USB socket
# (persisted in conf/instances.json). A plain reboot - even one that renumbers
# ttyUSB0<->ttyUSB1 - keeps the same instance. Moving the adapter to a DIFFERENT
# USB port or changing a hub would make it look like a new device in VRM.
#
# To make identity fully port-independent, key on the inverter's own serial
# number: set serial_reg to the FC04 input register where your model's ASCII
# serial starts (check the Ginlong doc) and serial_regs to how many 16-bit
# registers it spans (2 chars each). Leave serial_reg blank to use the socket.
serial_reg  =
serial_regs = 4

# DeviceInstance numbering start (persisted in conf/instances.json). Pick a
# range not used by other pvinverters on this GX.
instance_base = 40

# Identity-probe sanity bounds (reject non-Solis devices that happen to answer)
freq_min  = 45
freq_max  = 65
power_min = 300
power_max = 200000
